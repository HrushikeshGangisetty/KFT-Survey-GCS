name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All unit tests (commonTest on JVM + Android host) and the Android debug APK.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests and Android build
        run: ./gradlew check :app:android:assembleDebug --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # Desktop on Windows: our primary desktop target. Builds the runnable distribution.
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Desktop tests and distributable
        run: ./gradlew jvmTest :app:desktop:createDistributable --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: kft-gcs-windows
          path: app/desktop/build/compose/binaries/main/app/
